<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%" fill="none">
  <rect width="400" height="260" rx="16" fill="#F3F7ED"/>
  
  <!-- Bioconversion Tray / Pod -->
  <rect x="60" y="140" width="280" height="85" rx="12" fill="#E2EBE0" stroke="#4F8B59" stroke-width="2"/>
  <rect x="75" y="155" width="250" height="55" rx="8" fill="#174D38"/>
  
  <!-- Organic Substrate in tray -->
  <path d="M75 185 Q 140 175, 200 185 T 325 180 L 325 210 L 75 210 Z" fill="#2E4A35"/>
  
  <!-- BSF Larvae symbols (stylized high-protein capsules) -->
  <g fill="#C5DF8B">
    <ellipse cx="110" cy="180" rx="9" ry="5" transform="rotate(-15 110 180)"/>
    <ellipse cx="145" cy="175" rx="10" ry="5" transform="rotate(20 145 175)"/>
    <ellipse cx="180" cy="182" rx="9" ry="5" transform="rotate(-10 180 182)"/>
    <ellipse cx="215" cy="177" rx="10" ry="5" transform="rotate(15 215 177)"/>
    <ellipse cx="250" cy="183" rx="9" ry="5" transform="rotate(-25 250 183)"/>
    <ellipse cx="285" cy="178" rx="10" ry="5" transform="rotate(10 285 178)"/>
  </g>
  
  <!-- Adult BSF Silhouette / Fly Icon hovering above -->
  <g transform="translate(180, 55)">
    <!-- Wings -->
    <ellipse cx="10" cy="15" rx="22" ry="7" fill="#4F8B59" opacity="0.4" transform="rotate(-30 10 15)"/>
    <ellipse cx="30" cy="15" rx="22" ry="7" fill="#4F8B59" opacity="0.4" transform="rotate(30 30 15)"/>
    <!-- Body segments -->
    <ellipse cx="20" cy="20" rx="4" ry="14" fill="#174D38"/>
    <circle cx="20" cy="7" r="4.5" fill="#174D38"/>
    <!-- Antennae -->
    <path d="M18 4 Q 14 0, 10 1" stroke="#174D38" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M22 4 Q 26 0, 30 1" stroke="#174D38" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Transformation conversion flow -->
  <path d="M100 115 C 100 80, 140 85, 160 85" stroke="#4F8B59" stroke-width="2.5" stroke-dasharray="3 3"/>
  <polygon points="163,85 155,81 155,89" fill="#4F8B59"/>
  
  <path d="M240 85 C 260 85, 300 80, 300 115" stroke="#4F8B59" stroke-width="2.5" stroke-dasharray="3 3"/>
  <polygon points="300,118 296,110 304,110" fill="#4F8B59"/>

  <!-- Protein / Frass badges -->
  <rect x="70" y="95" width="85" height="26" rx="13" fill="#FFFFFF" stroke="#C5DF8B" stroke-width="1.5"/>
  <text x="112" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#174D38" text-anchor="middle">Food Scraps</text>
  
  <rect x="245" y="95" width="95" height="26" rx="13" fill="#FFFFFF" stroke="#4F8B59" stroke-width="1.5"/>
  <text x="292" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#174D38" text-anchor="middle">Protein &amp; Frass</text>
  
  <text x="200" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#174D38" text-anchor="middle">BSF Larvae Bioconversion</text>
</svg>
