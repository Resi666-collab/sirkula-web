<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Kata Sandi — SIRKULA</title>
  
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    .auth-page-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--color-warm-cream); font-family: 'Plus Jakarta Sans', sans-serif; }
    .reset-card { background: var(--color-white); border-radius: var(--radius-xl); padding: 3rem; width: 100%; max-width: 480px; box-shadow: var(--shadow-modal); border: 1px solid var(--color-border); }
    .form-group { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.25rem; }
    .form-label { font-weight: 700; font-size: 0.9rem; color: var(--color-forest-green); }
    .form-control { width: 100%; padding: 0.85rem 1rem; border: 1.5px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-warm-cream); font-family: inherit; font-size: 0.95rem; }
  </style>
</head>
<body class="auth-page-wrapper">
  <main class="reset-card">
    <h1 class="section-title" style="font-size: 2rem; margin-bottom: 0.35rem; color: var(--color-forest-green);">Buat Kata Sandi Baru</h1>
    <p class="section-subtitle" style="font-size: 0.95rem; margin-bottom: 2rem;">Silakan masukkan kata sandi baru Anda.</p>

    <form id="resetForm">
      <div class="form-group">
        <label class="form-label">Kata Sandi Baru</label>
        <input type="password" id="newPassword" class="form-control" placeholder="Minimal 8 karakter" required minlength="8">
      </div>
      
      <div class="form-group" style="margin-bottom: 2rem;">
        <label class="form-label">Konfirmasi Kata Sandi Baru</label>
        <input type="password" id="confirmPassword" class="form-control" placeholder="Ulangi kata sandi baru" required minlength="8">
      </div>

      <button type="submit" id="resetBtn" class="btn btn-primary btn-lg" style="width: 100%;">
        <span id="resetBtnText">Simpan Kata Sandi</span>
      </button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = 'https://sfgggatdahekprmkeomo.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmZ2dnYXRkYWhla3BybWtlb21vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3Mjc4NzIsImV4cCI6MjExMDMwMzg3Mn0.-H2ZAvkJLcGBEG1POuUnrcA9AYbTcxATJakSsCF7Qac';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    // Mendengarkan event PASSWORD_RECOVERY saat link email diklik
    supabaseClient.auth.onAuthStateChange(async (event, session) => {
      if (event == "PASSWORD_RECOVERY") {
        // User sudah membawa token valid dari email, siap ganti password
        console.log("Mode reset password aktif.");
      }
    });

    document.getElementById('resetForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const newPass = document.getElementById('newPassword').value;
      const confirmPass = document.getElementById('confirmPassword').value;
      const btnText = document.getElementById('resetBtnText');

      if (newPass !== confirmPass) {
        alert("Kata sandi dan konfirmasi tidak cocok!");
        return;
      }

      btnText.textContent = 'Menyimpan...';

      try {
        const { error } = await supabaseClient.auth.updateUser({
          password: newPass
        });

        if (error) throw error;
        
        alert('KATA SANDI BERHASIL DIUBAH! Silakan login kembali dengan kata sandi baru.');
        window.location.href = 'login.html';

      } catch (error) {
        alert('Gagal mengubah kata sandi: ' + error.message);
        btnText.textContent = 'Simpan Kata Sandi';
      }
    });
  </script>
</body>
</html>
